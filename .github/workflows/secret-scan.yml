name: secret-scan

# Full-history secret scan (CI/CD audit gap #1). Uses the gitleaks CLI (not the
# action) so it scans EVERY commit, not just the push. Template: claude-setup/ci-templates/gitleaks.yml.

on:
  push:
  pull_request:

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          VER=$(curl -sSfL https://api.github.com/repos/gitleaks/gitleaks/releases/latest | grep -oP '"tag_name":\s*"v\K[^"]+')
          echo "gitleaks v$VER"
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${VER}/gitleaks_${VER}_linux_x64.tar.gz" | tar -xz gitleaks
      - name: Scan full git history
        run: ./gitleaks detect --source . --redact --no-banner --exit-code 1
