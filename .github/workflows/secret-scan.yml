name: secret-scan

# Secret scanning (CI/CD audit gap #1). Scans full git history on every push/PR;
# a find fails the run. Template: claude-setup/ci-templates/gitleaks.yml.
# gitleaks-action is free for personal accounts (steelponymike).

on:
  push:
  pull_request:

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
